<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}BookShelf{% endblock %}</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      nav {
        padding-bottom: 1rem;
        border-bottom: 1px solid #ddd;
        margin-bottom: 2rem;
      }
      .book-card {
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .book-card h3 {
        margin: 0 0 0.5rem 0;
      }
      .meta {
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'catalog:book_list' %}"><strong>BookShelf</strong></a>
      <span style="float: right;">
        {% if user.is_authenticated %}
          Hi, {{ user.username }} —
          <form method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; color: #2563eb; cursor: pointer; padding: 0; font-size: 1rem;">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Log in</a>
        {% endif %}
      </span>
    </nav>

    {% block content %}{% endblock %}
  </body>
</html>
